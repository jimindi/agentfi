version: '3.3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentfi-postgres
    environment:
      POSTGRES_DB: agentfi_dev
      POSTGRES_USER: agentfi
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agentfi-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
